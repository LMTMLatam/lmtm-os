# LiteLLM router sidecar (LMTM-OS).
# Fronts NVIDIA (free, OpenAI-compatible) as primary with MiniMax (Anthropic-
# compatible) as automatic fallback, so agents pointed here keep working if the
# free NVIDIA tier rate-limits or fails. The `claude` CLI (claude_local adapter)
# hits this proxy's Anthropic /v1/messages endpoint; LiteLLM translates to the
# target provider and applies the fallback. Only pilot agents are repointed here
# (ANTHROPIC_BASE_URL=http://127.0.0.1:4000); the rest hit MiniMax directly.
model_list:
  # Primary: NVIDIA GLM-5.2 (validated end-to-end: chat + function-calling, and
  # confirmed as the serving backend via the broken-fallback test).
  - model_name: lmtm-glm
    litellm_params:
      model: openai/z-ai/glm-5.2
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
  # 2nd GLM deployment on a separate free-tier key: LiteLLM load-balances across
  # both under the same model_name, doubling the free rate-limit budget so the
  # 4 NVIDIA agents fall back to (slow) MiniMax far less often.
  - model_name: lmtm-glm
    litellm_params:
      model: openai/z-ai/glm-5.2
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY_2
  # Kimi K3 en NVIDIA: el ÚNICO modelo de la flota que ve imágenes. Verificado
  # 11/9/26 (describió una foto correctamente en español). OJO: es un modelo de
  # RAZONAMIENTO — con max_tokens chico devuelve content vacío y el texto queda
  # en reasoning_content, con HTTP 200. Medido: 16 tokens falla, 4096 anda.
  # No le pongas un cap bajo a este model_name.
  - model_name: lmtm-vision
    litellm_params:
      model: openai/moonshotai/kimi-k3
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY_VISION
      max_tokens: 4096
  # DeepSeek V4 Flash: texto y análisis, sin fuga de CJK. Reemplaza al -pro-0813,
  # que llegó a su end of life el 14/9/26 (HTTP 410) tres días después de
  # integrarlo. OJO: flash SÍ devuelve reasoning_content, así que necesita
  # presupuesto de tokens amplio o vuelve vacío con HTTP 200.
  - model_name: lmtm-deepseek
    litellm_params:
      model: openai/deepseek-ai/deepseek-v4-flash-0731
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY_TEXTO
  # Fallback: MiniMax-M3 over its Anthropic-compatible endpoint (the fleet default).
  - model_name: lmtm-minimax
    litellm_params:
      model: anthropic/MiniMax-M3
      api_base: https://api.minimax.io/anthropic
      api_key: os.environ/MINIMAX_API_KEY
  # Aliases for model names the `claude` CLI hardcodes internally (subagents /
  # small-fast model resolve to real Anthropic ids even when ANTHROPIC_MODEL is
  # set). Without these the proxy 400s ("Invalid model name") and the run dies
  # — seen on Carlos 2026-07-12. Route them to the same GLM pool.
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: openai/z-ai/glm-5.2
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: openai/z-ai/glm-5.2
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY

litellm_settings:
  # If the primary (NVIDIA) errors/times out, retry the request on MiniMax.
  # lmtm-vision NO tiene fallback a propósito: MiniMax y GLM no ven imágenes, y
  # caer a un modelo ciego devolvería una descripción inventada con cara de
  # respuesta válida. Mejor que falle y se note.
  fallbacks: [{"lmtm-glm": ["lmtm-minimax"]}, {"claude-sonnet-4-6": ["lmtm-minimax"]}, {"claude-haiku-4-5-20251001": ["lmtm-minimax"]}, {"lmtm-deepseek": ["lmtm-minimax"]}]
  drop_params: true
  request_timeout: 600
  num_retries: 1

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
